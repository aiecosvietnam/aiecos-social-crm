<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIECOS Connector</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #1a1d2e;
      width: 320px;
      max-height: 520px;
      overflow-y: auto;
    }

    .container { padding: 12px; }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e8ecf4;
    }

    .header-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .header-info { flex: 1; }

    .header h1 {
      font-size: 14px;
      font-weight: 700;
      color: #2563eb;
      letter-spacing: 0.3px;
    }

    .header-meta {
      font-size: 10px;
      color: #8b90a0;
      line-height: 1.3;
    }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #dc2626;
      margin-right: 4px;
      animation: pulse-red 1.5s infinite;
    }

    .status-indicator.active {
      background: #0d9668;
      animation: pulse-green 1.5s infinite;
    }

    @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes pulse-green { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .stats-container {
      background: #f8f9fc;
      border: 1px solid #e2e4ec;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .stats-title {
      font-size: 10px;
      font-weight: 600;
      color: #2563eb;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .page-stats {
      display: grid;
      gap: 4px;
      margin-bottom: 8px;
      max-height: 80px;
      overflow-y: auto;
    }

    .page-stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 6px 8px;
      border-radius: 4px;
      border-left: 3px solid #2563eb;
      font-size: 11px;
    }

    .page-stat-name {
      font-weight: 500;
      color: #1a1d2e;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .page-stat-count {
      background: #2563eb;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: 700;
      font-size: 10px;
      min-width: 32px;
      text-align: center;
    }

    .total-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eef2ff;
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid #2563eb;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 600;
    }

    .total-label { color: #5f6577; }
    .total-value { color: #0d9668; font-size: 14px; font-weight: 700; }

    .control-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }

    button {
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      transition: all 0.2s ease;
    }

    .btn-start {
      background: #2563eb;
      color: #ffffff;
      border: 1px solid #2563eb;
    }

    .btn-start:hover { background: #1d4ed8; box-shadow: 0 2px 8px rgba(37,99,235,0.3); }

    .btn-stop {
      background: #ffffff;
      color: #dc2626;
      border: 1px solid #dc2626;
    }

    .btn-stop:hover { background: #fef2f2; }

    .btn-walk {
      grid-column: 1 / -1;
      background: #0d9668;
      color: #ffffff;
      border: 1px solid #0d9668;
    }

    .btn-walk:hover { background: #0a8058; box-shadow: 0 2px 8px rgba(13,150,104,0.3); }

    .config-section {
      background: #f8f9fc;
      border: 1px solid #e2e4ec;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .config-title {
      font-size: 10px;
      font-weight: 600;
      color: #2563eb;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-group { margin-bottom: 8px; }

    .form-group label {
      display: block;
      font-size: 10px;
      color: #5f6577;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .form-group input {
      width: 100%;
      padding: 6px 8px;
      background: #ffffff;
      border: 1px solid #e2e4ec;
      border-radius: 4px;
      color: #1a1d2e;
      font-size: 11px;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 6px rgba(37,99,235,0.15);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      align-items: flex-end;
    }

    button.btn-save {
      padding: 6px 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 4px;
    }

    button.btn-save:hover { background: #1d4ed8; }

    .sync-interval {
      background: #fff7ed;
      padding: 8px;
      border-radius: 4px;
      border-left: 3px solid #d97706;
      font-size: 11px;
      color: #92400e;
      margin-top: 8px;
    }

    .sync-interval-label { font-weight: 600; margin-bottom: 2px; }
    .sync-interval-value { font-size: 12px; font-weight: 700; color: #d97706; }

    .footer {
      text-align: center;
      font-size: 9px;
      color: #8b90a0;
      border-top: 1px solid #e2e4ec;
      padding-top: 8px;
      margin-top: 8px;
    }

    .footer-text { margin: 2px 0; }

    .error-message {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #dc2626;
      padding: 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .success-message {
      background: #f0fdf4;
      border: 1px solid #86efac;
      color: #0d9668;
      padding: 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 8px;
    }

    body::-webkit-scrollbar { width: 4px; }
    body::-webkit-scrollbar-track { background: #f8f9fc; }
    body::-webkit-scrollbar-thumb { background: #c4c8d8; border-radius: 2px; }
    .page-stats::-webkit-scrollbar { width: 3px; }
    .page-stats::-webkit-scrollbar-thumb { background: #c4c8d8; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://nvznatemdpmuhqyznyqo.supabase.co/storage/v1/object/public/tainguyen/avatar-aiecos.png" class="header-logo" alt="AIECOS">
      <div class="header-info">
        <h1>AIECOS Connector</h1>
      </div>
      <div class="header-meta">
        <div><span class="status-indicator" id="statusIndicator"></span>Multi-Page</div>
        <div>v4.1.0</div>
      </div>
    </div>

    <div id="messageContainer"></div>

    <div class="stats-container">
      <div class="stats-title">Today's Stats</div>
      <div class="page-stats" id="pageStats">
        <div style="color: #8b90a0; font-size: 11px; padding: 12px; text-align: center;">
          Loading stats...
        </div>
      </div>
      <div class="total-bar">
        <span class="total-label">Total Messages:</span>
        <span class="total-value" id="totalMessages">0</span>
      </div>
    </div>

    <div class="control-buttons">
      <button class="btn-start" id="startBtn">&#9654; Sync</button>
      <button class="btn-stop" id="stopBtn">&#9632; Stop</button>
      <button class="btn-walk" id="walkBtn">&#128694; Sync All</button>
    </div>

    <div class="config-section">
      <div class="config-title">Server</div>

      <div class="form-group">
        <label for="agentUrl">Server URL</label>
        <div class="form-row">
          <input type="text" id="agentUrl" placeholder="https://your-sync-domain.com">
          <button class="btn-save" id="saveUrlBtn">Save</button>
        </div>
      </div>

      <div class="form-group">
        <label for="agentToken">API Token</label>
        <div class="form-row">
          <input type="password" id="agentToken" placeholder="Enter token">
          <button class="btn-save" id="saveTokenBtn">Save</button>
        </div>
      </div>

      <div class="sync-interval">
        <div class="sync-interval-label">Sync Interval:</div>
        <div class="sync-interval-value" id="syncInterval">— minutes</div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-text">AIECOS Connector v4.1.0</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
