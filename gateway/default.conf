# Dev-only gateway: exposes PostgREST under Supabase's /rest/v1 path.
# Auth headers are dropped because dev PostgREST has no JWT secret and
# serves everything as the anon role (see docker-compose.yml).
server {
  listen 80;

  location /rest/v1/ {
    proxy_pass http://postgrest:3000/;
    proxy_set_header Authorization "";
    proxy_set_header apikey "";
  }
}
